<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="360" height="380">
  <!-- Home page artwork, after Kandinsky: circles, arcs, triangles and a
       checkerboard over the city map, with a chain of links rising off the
       top edge as the global value chain. -->

  <!-- Discs and blocks, overlapping so the colours mix -->
  <g style="mix-blend-mode:multiply">
    <circle cx="104" cy="104" r="58" fill="#F2A93B"/>
    <circle cx="150" cy="140" r="34" fill="#F6C9BA"/>
    <circle cx="292" cy="86" r="48" fill="#2F5DA8"/>
    <circle cx="322" cy="128" r="26" fill="#2A9D8F"/>
    <polygon points="34,344 112,252 148,352" fill="#F6C9BA"/>
    <polygon points="246,300 312,258 322,332" fill="#2A9D8F"/>
    <rect x="186" y="214" width="66" height="54" fill="#F2A93B"/>
    <path d="M-14,196 C64,166 126,250 198,226 C270,202 294,286 374,268" fill="none" stroke="#9CC3E6" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Rings and arcs -->
  <g fill="none" stroke="#16232B">
    <circle cx="104" cy="104" r="70" stroke-width="1.6"/>
    <circle cx="188" cy="252" r="30" stroke-width="2"/>
    <path d="M232,352 A86,86 0 0 0 318,266" stroke-width="2.4"/>
    <path d="M24,236 A56,56 0 0 1 80,180" stroke-width="1.8"/>
  </g>

  <!-- Lines of the city, kept uneven -->
  <g stroke="#16232B" stroke-width="2.4" fill="none" stroke-linecap="round">
    <line x1="0" y1="252" x2="360" y2="252"/>
    <line x1="46" y1="0" x2="46" y2="380"/>
    <line x1="296" y1="0" x2="296" y2="380"/>
    <line x1="120" y1="0" x2="344" y2="150"/>
    <line x1="18" y1="330" x2="206" y2="196" stroke-width="1.4"/>
  </g>

  <!-- Checkerboard -->
  <g fill="#16232B">
    <rect x="258" y="196" width="12" height="12"/>
    <rect x="282" y="196" width="12" height="12"/>
    <rect x="270" y="208" width="12" height="12"/>
    <rect x="294" y="208" width="12" height="12"/>
    <rect x="258" y="220" width="12" height="12"/>
    <rect x="282" y="220" width="12" height="12"/>
  </g>
  <g fill="#E4572E">
    <rect x="270" y="196" width="12" height="12"/>
    <rect x="258" y="208" width="12" height="12"/>
    <rect x="294" y="196" width="12" height="12"/>
    <rect x="270" y="220" width="12" height="12"/>
  </g>

  <!-- The chain: out of the city and off the map -->
  <g transform="translate(188,252) rotate(-72)" stroke="#16232B" stroke-width="2.2" stroke-linecap="round" fill="none">
    <rect x="26" y="-6.5" width="30" height="13" rx="6.5"/>
    <rect x="66" y="-6.5" width="30" height="13" rx="6.5"/>
    <rect x="106" y="-6.5" width="30" height="13" rx="6.5"/>
    <rect x="146" y="-6.5" width="30" height="13" rx="6.5"/>
    <rect x="186" y="-6.5" width="30" height="13" rx="6.5"/>
    <rect x="226" y="-6.5" width="30" height="13" rx="6.5"/>
    <line x1="0" y1="0" x2="17" y2="0" stroke-width="3.2"/>
    <line x1="46" y1="0" x2="68" y2="0" stroke-width="3.2"/>
    <line x1="86" y1="0" x2="108" y2="0" stroke-width="3.2"/>
    <line x1="126" y1="0" x2="148" y2="0" stroke-width="3.2"/>
    <line x1="166" y1="0" x2="188" y2="0" stroke-width="3.2"/>
    <line x1="206" y1="0" x2="228" y2="0" stroke-width="3.2"/>
  </g>

  <!-- Nodes and dots -->
  <circle cx="188" cy="252" r="9" fill="#E4572E"/>
  <circle cx="296" cy="252" r="17" fill="#E4572E"/>
  <circle cx="46" cy="252" r="9" fill="#E4572E"/>
  <circle cx="46" cy="104" r="6" fill="#16232B"/>
  <g fill="#16232B">
    <circle cx="126" cy="196" r="3.5"/>
    <circle cx="140" cy="186" r="2.5"/>
    <circle cx="112" cy="188" r="2"/>
  </g>
</svg>
